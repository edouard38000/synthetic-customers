# CI for every pull request and for main, on the repo's victus self-hosted
# runner (Linux, Rust toolchain in the image).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: [self-hosted, victus]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
