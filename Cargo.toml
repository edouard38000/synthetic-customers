[package]
name = "synthetic-customers"
version = "0.1.0"
edition = "2024"
description = "Test a product idea on AI-played customers, scored with semantic similarity rating (SSR)"
license = "Apache-2.0"
repository = "https://github.com/edouard38000/synthetic-customers"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "6"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
toml = { version = "1.2.2", features = ["preserve_order"] }
tract-onnx = { version = "0.23.10", default-features = false }
# The hosted Scorers' HTTP client: the same ureq + rustls (ring) stack hf-hub
# already uses, so no OpenSSL or aws-lc is linked.
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

# The local Scorer's model runs far too slowly unoptimised; optimise its
# runtime even in test builds so the gold-set test takes seconds.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
